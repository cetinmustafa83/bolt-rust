[package]
name = "bolt-server"
version = "1.0.0"
edition = "2021"
description = "Rust backend for bolt.diy: static SPA serving + light API surface + streaming LLM relay"

[dependencies]
axum = { version = "0.8", features = ["http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "set-header"] }
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "json"] }
futures-util = "0.3"
percent-encoding = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
lto = "thin"
